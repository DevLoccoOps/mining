spring.application.name=minesafe-backend
server.port=8080
spring.threads.virtual.enabled=true

# --- PostgreSQL ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minesafe}
spring.datasource.username=${DB_USERNAME:lebohang}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true

# --- MQTT ingestion (same broker + topic as the legacy Python app) ---
#   BROKER_ADDRESS = sakura.proxy.rlwy.net
#   BROKER_PORT    = 50528
#   TOPIC          = knot/ble/tags
# Note: broker rejects the MQTT 5 handshake (EOF), so we use the paho
# component speaking MQTT 3.1.1 - the same protocol as the Python client.
app.mqtt.broker-url=${MQTT_BROKER_URL:tcp://sakura.proxy.rlwy.net:50528}
app.mqtt.topic=${MQTT_TOPIC:knot/ble/tags}
app.mqtt.client-id=${MQTT_CLIENT_ID:minesafe-spring}
camel.component.paho.broker-url=${app.mqtt.broker-url}
camel.component.paho.client-id=${app.mqtt.client-id}
camel.component.paho.automatic-reconnect=true
camel.component.paho.max-reconnect-delay=10000

# --- Alert log retention (hourly cleanup, app.py:103) ---
app.alerts.max-retention=${ALERTS_MAX_RETENTION:50000}

# --- Telemetry retention (hourly cleanup, time-based) ---
app.telemetry.retention-hours=${TELEMETRY_RETENTION_HOURS:24}

# --- Jackson: snake_case to keep parity with the legacy Python API ---
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.serialization.write-dates-as-timestamps=false

# --- API docs ---
springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/swagger-ui.html

# --- CORS (React dev servers) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

management.endpoints.web.exposure.include=health,info,camel

# --- Logging (raise to DEBUG to trace raw BLE payloads on the ingest route) ---
logging.level.com.minesafe=INFO
